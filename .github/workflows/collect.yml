name: collect
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node collector/collect.mjs
      - run: |
          git config user.name "offblock-collector"
          git config user.email "collector@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet && exit 0
          git commit -m "collect $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && exit 0
            git rebase --abort 2>/dev/null
            sleep 5
          done
          exit 1
